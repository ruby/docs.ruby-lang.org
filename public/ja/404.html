<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-HBG2MP4NRL"></script>

  window.dataLayer = window.dataLayer || [];

<title>ページが見つかりません - Ruby リファレンスマニュアル</title>
<link rel="stylesheet" href="/assets/bootstrap.min.css">
<link rel="stylesheet" href="/ja/search/search.css">
<style>
/* 検索ボックス用の search.css をページ内表示向けに上書きする */
#search-section {
  position: static;
  width: auto;
  max-width: none;
  margin: 1em 0 0.5em;
}
#search-field {
  font-size: 1.1em;
}
.search-results {
  position: static;
  border: none;
  box-shadow: none;
  max-height: none;
  overflow: visible;
}
.search-versions {
  margin: 0.15em 0 0;
  font-size: 0.8em;
  color: #555;
}
.search-versions a {
  display: inline-block;
  margin-right: 0.35em;
  padding: 0 0.4em;
  border: 1px solid #99a;
  border-radius: 3px;
  text-decoration: none;
}
.notfound-note {
  font-size: 0.9em;
  color: #555;
}
</style>
<script>
// notfound-logic: 見つからなかった URL から検索語を推測する。
// bitclust が生成する静的 HTML の URL 構造
// (/ja/<version>/method/<クラス>/<種別>/<名前>.html など)と、
// ファイル名のエンコード(英数字と _ 以外の 1 バイトを =XX)に従う。
var search_version_base = "/ja/";

function decodeName(segment) {
  var s = segment;
  try { s = decodeURIComponent(s); } catch (e) {}
  s = s.replace(/%/g, '%25').replace(/=([0-9a-fA-F]{2})/g, '%$1');
  try { return decodeURIComponent(s); } catch (e) { return segment; }
}

function deriveQuery(pathname) {
  var m = pathname.match(/^\/ja\/[^\/]+\/(method|class|library|doc|function)\/(.+)\.html$/);
  if (!m) return null;
  var kind = m[1];
  var rest = m[2];
  if (kind === 'method') {
    var mm = rest.match(/^([^\/]+)\/([ismcv])\/([^\/]+)$/);
    if (!mm) return null;
    var name = decodeName(mm[3]);
    if (mm[2] === 'v') return '$' + name;
    var marks = { i: '#', s: '.', m: '?.', c: '::' };
    return decodeName(mm[1]) + marks[mm[2]] + name;
  }
  if (rest.indexOf('/') !== -1) return null;
  var base = decodeName(rest);
  if (base === 'index') return null;
  // クラス名に "." を含むのは ARGF.class だけで、検索はメソッド名と解釈する
  if (kind === 'class') return base.replace(/\..*$/, '');
  return base;
}

// 別バージョンの URL なら、最新版の同じ URL を候補にする
function latestUrl(pathname) {
  var m = pathname.match(/^\/ja\/([0-9][^\/]*)\/(.*)$/);
  return m ? '/ja/latest/' + m[2] : null;
}

// 検索ページのスクリプト(後続の defer 読み込み)は ?q= を初期検索語に
// するので、推測した名前を ?q= に入れておく。再読み込みや共有で
// 既に ?q= があるときは、そちらを優先する
if (typeof window !== 'undefined' && window.location && window.history) {
  (function () {
    if (/[?&](q|query)=/.test(window.location.search)) return;
    var q = deriveQuery(window.location.pathname);
    if (!q) return;
    try {
      window.history.replaceState(null, '', window.location.pathname + '?q=' + encodeURIComponent(q));
    } catch (e) {}
  })();
}
</script>
<script src="/ja/search/js/search_data.js" defer></script>
<script src="/ja/search/js/search_navigation.js" defer></script>
<script src="/ja/search/js/search_ranker.js" defer></script>
<script src="/ja/search/js/search_controller.js" defer></script>
<script src="/ja/search/js/search_page.js" defer></script>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>ページが見つかりません</h1>
  </div>
  <p>お探しのページは存在しません。ページの移動や削除、またはリンクの誤りの可能性があります。</p>
  <p id="notfound-where" hidden>リクエストされた URL: <code></code></p>
  <p id="notfound-hint" hidden>URL から推測した「<strong></strong>」でリファレンスを検索しました。別の名前でも検索できます。</p>
  <form id="search-section" role="search" action="/ja/search/" method="get">
    <input id="search-field" name="q" type="text" autocomplete="off" spellcheck="false"
           placeholder="クラス / メソッド / ライブラリ名で検索 (例: Array#each, String, socket)"
           aria-label="リファレンス検索">
    <ul id="search-results" class="search-results" aria-expanded="false"></ul>
  </form>
  <p class="notfound-note">クラス・モジュール・メソッド・ライブラリ・特殊変数・ドキュメントの名前を全バージョン横断で検索します。検索結果のバージョンリンクから各バージョンのページを開けます(<a href="/ja/search/">リファレンス検索</a>)。</p>
  <ul>
    <li id="notfound-latest" hidden><a href="/ja/latest/">最新版の同じ URL を開く</a></li>
    <li><a href="/ja/">Ruby リファレンスマニュアル(バージョン一覧)</a></li>
    <li><a href="/">docs.ruby-lang.org</a></li>
  </ul>
</div>
<script>
(function () {
  var path = window.location.pathname;
  var where = document.getElementById('notfound-where');
  var shown = path;
  try { shown = decodeURIComponent(path); } catch (e) {}
  where.querySelector('code').textContent = shown;
  where.removeAttribute('hidden');

  // 推測した名前で検索しているときだけ、その旨を出す(?q= を書き換えて
  // 再読み込みしたときは出さない)
  var q = deriveQuery(path);
  var current = window.location.search.match(/[?&]q=([^&]*)/);
  try { current = current && decodeURIComponent(current[1].replace(/\+/g, ' ')); } catch (e) { current = null; }
  if (q && (!current || current === q)) {
    var hint = document.getElementById('notfound-hint');
    hint.querySelector('strong').textContent = q;
    hint.removeAttribute('hidden');
  }

  var latest = latestUrl(path);
  if (latest) {
    var item = document.getElementById('notfound-latest');
    item.querySelector('a').href = latest;
    item.removeAttribute('hidden');
  }
})();
</script>
</body>
</html>
